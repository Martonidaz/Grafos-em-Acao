<section class="card secao">
  <h2>Passo a passo da execução</h2>
  <p class="dica" style="margin-top:0">Os passos são gerados pelo Python durante a execução.</p>
  <div class="player">
    <button class="btn secundario pequeno" id="btn-anterior" disabled>Anterior</button>
    <button class="btn pequeno" id="btn-play" disabled>Reproduzir</button>
    <button class="btn secundario pequeno" id="btn-proximo" disabled>Próximo</button>
    <button class="btn secundario pequeno" id="btn-final" disabled>Resultado final</button>
    <span class="contador" id="contador"></span>
  </div>
  <div class="passo-atual" id="passo-texto"><p class="vazio">Execute o algoritmo para ver as etapas.</p></div>
  <div id="extra-passo"></div>
  <ul class="lista-passos" id="lista-passos"></ul>
</section>
