# Só configuração de ferramentas; dependências em requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["static/vendor"]

[tool.ruff.lint]
# F: código morto/no-op · SIM103: if x: return True else: return False · RET505: else redundante
# B006: mutable default argument · PL: complexidade e números mágicos · I: ordem dos imports
select = ["F", "E", "W", "I", "B", "SIM", "RET", "PL", "RUF"]
