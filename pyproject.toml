# Só configuração de ferramentas; dependências em requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["static/vendor"]

[tool.ruff.lint]
# F: código morto/no-op · SIM103: if x: return True else: return False · RET505: else redundante
# B006: mutable default argument · PL: complexidade e números mágicos · I: ordem dos imports
select = ["F", "E", "W", "I", "B", "SIM", "RET", "PL", "RUF"]
# complexidade e números mágicos: o código que monta o passo a passo é didático e linear de propósito
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"dados/bairros_api.py" = ["E501"]
"dados/vra_latam.py" = ["E501"]  # lista de bairros e chamadas longas, lidas melhor numa linha só
