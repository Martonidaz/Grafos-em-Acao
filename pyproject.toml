[project]
name = "grafos-em-acao"
version = "0.1.0"
description = "Dijkstra, Prim e Kruskal aplicados a problemas reais (Trabalho Final de Teoria dos Grafos)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Sem dependências de execução. Para desenvolver: pip install pytest ruff networkx
# (networkx só como oráculo nos testes, nunca em src/). Sem build/instalação: o pytest acha src/ sozinho.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F: código morto/no-op · SIM103: if x: return True else: return False · RET505: else redundante
# B006: mutable default argument · PL: complexidade e números mágicos · I: ordem dos imports
select = ["F", "E", "W", "I", "B", "SIM", "RET", "PL", "RUF"]
